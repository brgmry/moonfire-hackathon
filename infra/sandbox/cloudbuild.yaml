# gcloud builds submit --config infra/sandbox/cloudbuild.yaml --substitutions _IMAGE=$IMAGE .
# Pulls the previous image first so the apt/npm layers come from cache on code-only rebuilds.
steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ['-c', 'docker pull ${_IMAGE} || exit 0']
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_IMAGE}', '--cache-from', '${_IMAGE}', '-f', 'infra/sandbox/Dockerfile', '.']
images: ['${_IMAGE}']
options:
  machineType: E2_HIGHCPU_8
